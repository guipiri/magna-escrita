name: Deploy API and Worker to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-api.yml'
      - 'package.json'
      - 'yarn.lock'
      - 'turbo.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  ARTIFACT_REGISTRY_REPO: ${{ secrets.ARTIFACT_REGISTRY_REPO }}
  SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
  WORKER_SERVICE_NAME: ${{ secrets.CLOUD_RUN_WORKER_SERVICE_NAME }}
  IMAGE_NAME: api
  REDIS_INSTANCE_NAME: ${{ secrets.REDIS_INSTANCE_NAME || 'magna-escrita-redis' }}

jobs:
  deploy:
    name: Build, Push & Deploy API and Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup GCP Memorystore (Redis)
        id: setup-redis
        run: |
          REDIS_NAME="${{ env.REDIS_INSTANCE_NAME }}"
          REGION="${{ env.GCP_REGION }}"
          PROJECT="${{ env.GCP_PROJECT_ID }}"

          echo "Checking if Redis instance '$REDIS_NAME' exists in region '$REGION'..."
          if ! gcloud redis instances describe "$REDIS_NAME" --region="$REGION" --project="$PROJECT" >/dev/null 2>&1; then
            echo "Redis instance not found. Creating Memorystore Redis instance '$REDIS_NAME'..."
            gcloud redis instances create "$REDIS_NAME" \
              --size=1 \
              --region="$REGION" \
              --tier=basic \
              --network=default \
              --project="$PROJECT"
          else
            echo "Redis instance '$REDIS_NAME' already exists."
          fi

          echo "Fetching Redis connection details..."
          REDIS_HOST=$(gcloud redis instances describe "$REDIS_NAME" --region="$REGION" --project="$PROJECT" --format="value(host)")
          REDIS_PORT=$(gcloud redis instances describe "$REDIS_NAME" --region="$REGION" --project="$PROJECT" --format="value(port)")

          if [ -z "$REDIS_HOST" ] || [ -z "$REDIS_PORT" ]; then
            echo "Failed to retrieve Redis host or port."
            exit 1
          fi

          REDIS_URL="redis://${REDIS_HOST}:${REDIS_PORT}"
          echo "Redis URL: redis://${REDIS_HOST}:${REDIS_PORT}"
          echo "redis_url=${REDIS_URL}" >> $GITHUB_OUTPUT

      - name: Deploy API to Cloud Run
        id: deploy-api
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: '--service-account=magna-escrita-runtime@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com --allow-unauthenticated --port=8080 --vpc-egress=private-ranges-only --network=default'
          env_vars: |
            NODE_ENV=production
            REDIS_URL=${{ steps.setup-redis.outputs.redis_url }}
          secrets: |
            CORS_ORIGIN=CORS_ORIGIN:latest
            MERCADOPAGO_ACCESS_TOKEN=MERCADOPAGO_ACCESS_TOKEN:latest
            MERCADOPAGO_WEBHOOK_SECRET=MERCADOPAGO_WEBHOOK_SECRET:latest
            DATABASE_URL=DATABASE_URL:latest
            GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest
            GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest
            JWT_SECRET=JWT_SECRET:latest
            JWT_EXPIRES_IN=JWT_EXPIRES_IN:latest
            AUTH_COOKIE_NAME=AUTH_COOKIE_NAME:latest
            AUTH_COOKIE_MAX_AGE_DAYS=AUTH_COOKIE_MAX_AGE_DAYS:latest
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            CLOUDFLARE_R2_ACCOUNT_ID=CLOUDFLARE_R2_ACCOUNT_ID:latest
            CLOUDFLARE_R2_ACCESS_KEY_ID=CLOUDFLARE_R2_ACCESS_KEY_ID:latest
            CLOUDFLARE_R2_SECRET_ACCESS_KEY=CLOUDFLARE_R2_SECRET_ACCESS_KEY:latest
            CLOUDFLARE_R2_BUCKET_NAME=CLOUDFLARE_R2_BUCKET_NAME:latest
            CLOUDFLARE_R2_PUBLIC_URL=CLOUDFLARE_R2_PUBLIC_URL:latest
            SMTP_FROM=SMTP_FROM:latest
            SMTP_HOST=SMTP_HOST:latest
            SMTP_PORT=SMTP_PORT:latest
            SMTP_USER=SMTP_USER:latest
            SMTP_PASS=SMTP_PASS:latest
            SMTP_SECURE=SMTP_SECURE:latest
            GEMINI_MODEL=GEMINI_MODEL:latest

      - name: Deploy Worker to Cloud Run
        id: deploy-worker
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.WORKER_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: '--command=node --args=apps/api/dist/src/worker.js --service-account=magna-escrita-runtime@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com --no-allow-unauthenticated --vpc-egress=private-ranges-only --network=default'
          env_vars: |
            NODE_ENV=production
            REDIS_URL=${{ steps.setup-redis.outputs.redis_url }}
          secrets: |
            CORS_ORIGIN=CORS_ORIGIN:latest
            MERCADOPAGO_ACCESS_TOKEN=MERCADOPAGO_ACCESS_TOKEN:latest
            MERCADOPAGO_WEBHOOK_SECRET=MERCADOPAGO_WEBHOOK_SECRET:latest
            DATABASE_URL=DATABASE_URL:latest
            GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest
            GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest
            JWT_SECRET=JWT_SECRET:latest
            JWT_EXPIRES_IN=JWT_EXPIRES_IN:latest
            AUTH_COOKIE_NAME=AUTH_COOKIE_NAME:latest
            AUTH_COOKIE_MAX_AGE_DAYS=AUTH_COOKIE_MAX_AGE_DAYS:latest
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            CLOUDFLARE_R2_ACCOUNT_ID=CLOUDFLARE_R2_ACCOUNT_ID:latest
            CLOUDFLARE_R2_ACCESS_KEY_ID=CLOUDFLARE_R2_ACCESS_KEY_ID:latest
            CLOUDFLARE_R2_SECRET_ACCESS_KEY=CLOUDFLARE_R2_SECRET_ACCESS_KEY:latest
            CLOUDFLARE_R2_BUCKET_NAME=CLOUDFLARE_R2_BUCKET_NAME:latest
            CLOUDFLARE_R2_PUBLIC_URL=CLOUDFLARE_R2_PUBLIC_URL:latest
            SMTP_FROM=SMTP_FROM:latest
            SMTP_HOST=SMTP_HOST:latest
            SMTP_PORT=SMTP_PORT:latest
            SMTP_USER=SMTP_USER:latest
            SMTP_PASS=SMTP_PASS:latest
            SMTP_SECURE=SMTP_SECURE:latest
            GEMINI_MODEL=GEMINI_MODEL:latest

      - name: Print Cloud Run Service URLs
        run: |
          echo "API successfully deployed to: ${{ steps.deploy-api.outputs.url }}"
          echo "Worker successfully deployed to: ${{ steps.deploy-worker.outputs.url }}"
